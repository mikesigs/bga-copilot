<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BGA Copilot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel">
      <header class="panel-header">
        <span class="title">BGA Copilot</span>
        <button id="settings-toggle" class="icon-btn" type="button" aria-label="Settings">⚙</button>
      </header>

      <section id="chat-view" class="view">
        <div id="key-prompt" class="key-prompt" hidden>
          <p>Add your API key to get started.</p>
          <button id="key-prompt-open-settings" type="button">Open settings</button>
        </div>
        <div id="finished-banner" class="key-prompt" hidden>
          <p>This game has ended — chat is read-only.</p>
        </div>
        <main class="msg-list" id="msg-list">
          <p class="empty-state" id="empty-state">No messages yet.</p>
        </main>
        <div class="quick-actions" id="quick-actions">
          <button type="button" class="quick-action" data-prompt="Suggest my next move.">Suggest my next move</button>
          <button type="button" class="quick-action" data-prompt="Explain this rule.">Explain this rule</button>
          <button type="button" class="quick-action" data-prompt="What just happened?">What just happened</button>
        </div>
        <div class="composer">
          <input type="text" id="composer-input" placeholder="Ask about the game..." />
          <button type="button" id="composer-send">Send</button>
        </div>
      </section>

      <section id="settings-view" class="view" hidden>
        <div class="settings-body">
          <label class="field-label">LLM Providers</label>

          <div class="provider-cards">
            <div class="provider-card" data-provider="anthropic">
              <div class="provider-card-header">
                <input type="radio" name="active-provider" id="active-anthropic" />
                <label for="active-anthropic">Anthropic</label>
              </div>

              <div class="provider-key-status" id="key-status-anthropic">
                <span id="key-preview-anthropic">Not configured</span>
                <button type="button" id="edit-anthropic">Add key</button>
              </div>

              <div class="provider-key-edit" id="key-edit-anthropic" hidden>
                <input type="password" id="key-input-anthropic" placeholder="sk-ant-..." autocomplete="off" />
                <div class="provider-card-actions">
                  <button type="button" id="save-anthropic">Save</button>
                  <button type="button" class="secondary" id="cancel-anthropic">Cancel</button>
                </div>
                <p class="key-error" id="error-anthropic" hidden></p>
              </div>
            </div>

            <div class="provider-card" data-provider="openai">
              <div class="provider-card-header">
                <input type="radio" name="active-provider" id="active-openai" />
                <label for="active-openai">OpenAI</label>
              </div>

              <div class="provider-key-status" id="key-status-openai">
                <span id="key-preview-openai">Not configured</span>
                <button type="button" id="edit-openai">Add key</button>
              </div>

              <div class="provider-key-edit" id="key-edit-openai" hidden>
                <input type="password" id="key-input-openai" placeholder="sk-..." autocomplete="off" />
                <div class="provider-card-actions">
                  <button type="button" id="save-openai">Save</button>
                  <button type="button" class="secondary" id="cancel-openai">Cancel</button>
                </div>
                <p class="key-error" id="error-openai" hidden></p>
              </div>
            </div>
          </div>

          <p class="disclosure">
            Your key is stored only in this browser and sent directly to the chosen provider, never to us or
            any other server. Treat it like a password.
          </p>
        </div>
      </section>
    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
