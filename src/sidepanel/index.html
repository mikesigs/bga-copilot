<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BGA Copilot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel">
      <header class="panel-header">
        <span class="title">BGA Copilot</span>
        <button id="settings-toggle" class="icon-btn" type="button" aria-label="Settings">⚙</button>
      </header>

      <section id="chat-view" class="view">
        <div id="key-prompt" class="key-prompt" hidden>
          <p>Add your API key to get started.</p>
          <button id="key-prompt-open-settings" type="button">Open settings</button>
        </div>
        <main class="msg-list" id="msg-list">
          <p class="empty-state">No messages yet.</p>
        </main>
        <div class="composer">
          <input type="text" placeholder="Ask about the game..." disabled />
          <button type="button" disabled>Send</button>
        </div>
      </section>

      <section id="settings-view" class="view" hidden>
        <div class="settings-body">
          <label class="field-label">LLM Providers</label>

          <div class="provider-cards">
            <div class="provider-card" data-provider="anthropic">
              <div class="provider-card-header">
                <input type="radio" name="active-provider" id="active-anthropic" />
                <label for="active-anthropic">Anthropic</label>
                <span class="key-status-badge" id="badge-anthropic"></span>
              </div>
              <input type="password" id="key-input-anthropic" placeholder="sk-ant-..." autocomplete="off" />
              <div class="provider-card-actions">
                <button type="button" id="save-anthropic">Save</button>
                <span class="key-error" id="error-anthropic" hidden></span>
                <span class="key-saved" id="saved-anthropic" hidden>Saved.</span>
              </div>
            </div>

            <div class="provider-card" data-provider="openai">
              <div class="provider-card-header">
                <input type="radio" name="active-provider" id="active-openai" />
                <label for="active-openai">OpenAI</label>
                <span class="key-status-badge" id="badge-openai"></span>
              </div>
              <input type="password" id="key-input-openai" placeholder="sk-..." autocomplete="off" />
              <div class="provider-card-actions">
                <button type="button" id="save-openai">Save</button>
                <span class="key-error" id="error-openai" hidden></span>
                <span class="key-saved" id="saved-openai" hidden>Saved.</span>
              </div>
            </div>
          </div>

          <p class="disclosure">
            Your key is stored only in this browser and sent directly to the chosen provider, never to us or
            any other server. Treat it like a password.
          </p>
        </div>
      </section>
    </div>
    <script src="sidepanel.js"></script>
  </body>
</html>
